services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: edurag
      POSTGRES_PASSWORD: edurag
      POSTGRES_DB: edurag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edurag"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app          # live code reload
    restart: unless-stopped

volumes:
  pgdata:
